<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home Buyers Guide Book</title>

    <!-- Favicon -->
    <link 
        rel="icon" 
        type="image/png" 
        href="https://i.imgur.com/TcCQCER.png"
    >

    <link 
        rel="shortcut icon" 
        type="image/png" 
        href="https://i.imgur.com/TcCQCER.png"
    >

    <!-- Apple / Mobile Icon -->
    <link 
        rel="apple-touch-icon" 
        href="https://i.imgur.com/TcCQCER.png"
    >

    <!-- Open Graph -->
    <meta property="og:title" content="Home Buyers Guide Book">
    <meta property="og:description" content="Your Home Buyers Guide">
    <meta 
        property="og:image" 
        content="https://i.imgur.com/TcCQCER.png"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #f4f5fb;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            text-align: center;
            color: #222689;
        }

        .loading img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .spinner {
            width: 35px;
            height: 35px;
            margin: 0 auto 15px;

            border: 3px solid #dde0f0;
            border-top-color: #222689;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading p {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="loading">

        <img 
            src="https://i.imgur.com/TcCQCER.png"
            alt="Home Buyers Guide"
        >

        <div class="spinner"></div>

        <p>Loading Home Buyers Guide...</p>

    </div>

    <script>
        const GAS_URL =
            "https://script.google.com/macros/s/AKfycbyRI9cd5PMWAS_X3o0xYf1X8pSoKnMKApX30yv1xlQMVLjDkj-UYMJ0zOAx-5Y9-2Bz2g/exec";

        window.location.replace(GAS_URL);
    </script>

</body>
</html>
