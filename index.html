<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home Buyers Guide Book</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-13SMX0MWR6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-13SMX0MWR6');
    </script>

    <!-- =========================================
         INNERSPARC FAVICON
         ========================================= -->

    <link
        rel="icon"
        type="image/png"
        href="https://i.imgur.com/TcCQCER.png"
    >

    <link
        rel="shortcut icon"
        type="image/png"
        href="https://i.imgur.com/TcCQCER.png"
    >

    <link
        rel="apple-touch-icon"
        href="https://i.imgur.com/TcCQCER.png"
    >

    <!-- Open Graph / Social Preview -->

    <meta
        property="og:title"
        content="Home Buyers Guide Book"
    >

    <meta
        property="og:description"
        content="Your Home Buyers Guide"
    >

    <meta
        property="og:image"
        content="https://i.imgur.com/TcCQCER.png"
    >

    <meta
        property="og:type"
        content="website"
    >

    <style>

        /* =========================================
           RESET
           ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =========================================
           PAGE
           ========================================= */

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #f4f5fb;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* =========================================
           LOADING CONTAINER
           ========================================= */

        .loading {
            text-align: center;
            color: #222689;
            padding: 30px;
        }

        /* =========================================
           LOGO
           ========================================= */

        .loading img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 18px;
        }

        /* =========================================
           SPINNER
           ========================================= */

        .spinner {
            width: 35px;
            height: 35px;
            margin: 0 auto 15px;
            border: 3px solid #dde0f0;
            border-top-color: #222689;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* =========================================
           SPINNER ANIMATION
           ========================================= */

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================
           LOADING TEXT
           ========================================= */

        .loading p {
            font-size: 14px;
            color: #222689;
            margin-top: 5px;
        }

        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {
            .loading img {
                width: 60px;
                height: 60px;
            }

            .spinner {
                width: 32px;
                height: 32px;
            }

            .loading p {
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================================
         LOADING SCREEN
         ========================================= -->

    <div class="loading">
        <img
            src="https://i.imgur.com/TcCQCER.png"
            alt="Innersparc"
        >

        <div class="spinner"></div>

        <p>
            Loading Home Buyers Guide...
        </p>
    </div>

    <!-- =========================================
         GOOGLE APPS SCRIPT REDIRECT
         ========================================= -->

    <script>
        const GAS_URL =
            "https://script.google.com/macros/s/AKfycbyRI9cd5PMWAS_X3o0xYf1X8pSoKnMKApX30yv1xlQMVLjDkj-UYMJ0zOAx-5Y9-2Bz2g/exec";

        // Small delay so the favicon/logo and analytics can initialize
        // before redirecting.
        setTimeout(function () {
            window.location.replace(GAS_URL);
        }, 500);
    </script>

</body>
</html>
